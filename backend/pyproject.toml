[project]
name = "dock-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "procrastinate>=2.0",
  "mcp>=1.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "python-ulid>=2.7",
  "fractional-indexing>=0.1.3",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "lark>=1.2",
  "authlib>=1.3",
  "PyJWT>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
