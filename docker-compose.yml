services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dock
      POSTGRES_PASSWORD: dock
      POSTGRES_DB: dock
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dock -d dock"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1
    environment:
      DATABASE_URL: postgresql+asyncpg://dock:dock@db:5432/dock
      JWT_SECRET: dev-secret-change-me-please-use-32-bytes-min
      FASTEMBED_CACHE_PATH: /cache/fastembed
      PRELOAD_EMBEDDING_MODEL: "true"
    volumes:
      - ./backend:/srv
      - ./demo:/srv/demo:ro  # MCP-Import per file_path über HTTP (B11): demo/Bestelluebersicht.xlsx
      - model_cache:/cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://dock:dock@db:5432/dock
      FASTEMBED_CACHE_PATH: /cache/fastembed
    volumes:
      - ./backend:/srv
      - model_cache:/cache
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /srv
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/srv
      - frontend_node_modules:/srv/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dbdata:
  frontend_node_modules:
  model_cache:
